[openshell]
version = 2

[openshell.gateway]
name = "jrr24-worker"
bind_address = "127.0.0.1:18818"
compute_driver = "docker"
guest_tls_ca = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/ca.crt"

[openshell.drivers.docker]
allow_driver_config = true
sandbox_label = "jrr24-worker-poc"
sandbox_pids_limit = 64
enable_bind_mounts = true

[openshell.drivers.docker.resource_admission]
enabled = false

[openshell.gateway.tls]
cert_path = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/server/tls.crt"
key_path = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/server/tls.key"
client_ca_path = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/ca.crt"

[openshell.gateway.gateway_jwt]
signing_key_path = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/jwt/signing.pem"
public_key_path = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/jwt/public.pem"
kid_path = "/Users/example/openshell-jackin-poc/research/full-refactor/experiments/control/certs/jwt/kid"
gateway_id = "jrr24-worker"
