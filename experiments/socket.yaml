version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/usr, /usr/local, /lib, /lib64, /etc, /proc, /sys, /dev/urandom, /opt]
  read_write: [/workspace, /sandbox, /tmp, /home, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  engine:
    endpoints:
      - host: host.docker.internal
        port: 18776
        protocol: tcp
        tls: skip
        allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]
      - host: host.docker.internal
        port: 18777
        protocol: tcp
        tls: skip
        allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]
    binaries:
      - path: /usr/local/bin/docker
      - path: /usr/local/libexec/docker/cli-plugins/docker-compose
      - path: /usr/bin/python3*
      - path: /sandbox/ojp-project/**
      - path: /workspace/rust-project/**
      - path: /usr/local/bin/mise
      - path: /usr/local/bin/mbx
      - path: /usr/local/bin/cargo-nextest
      - path: /usr/local/rustup/**
      - path: /home/agent/.local/**
  service:
    endpoints:
      - host: host.docker.internal
        port: 15432
        protocol: tcp
        allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]
      - host: host.docker.internal
        port: 18080
        protocol: tcp
        allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]
    binaries:
      - path: /usr/bin/python3*
      - path: /usr/bin/curl
      - path: /sandbox/ojp-project/**
      - path: /workspace/rust-project/**
      - path: /usr/local/bin/mise
      - path: /usr/local/bin/mbx
      - path: /usr/local/bin/cargo-nextest
      - path: /usr/local/rustup/**
      - path: /home/agent/.local/**


  crates:
    endpoints:
      - {host: index.crates.io, port: 443}
      - {host: static.crates.io, port: 443}
      - {host: crates.io, port: 443}
    binaries:
      - {path: /usr/local/bin/mise}
      - {path: /usr/local/bin/mbx}
      - {path: /usr/local/rustup/**}
      - {path: /home/agent/.local/**}
  allocated_services:
    endpoints:
      - {host: host.docker.internal, port: 18081, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18082, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18083, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18084, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
    binaries:
      - {path: /usr/bin/python3*}
      - {path: /usr/bin/curl}
      - {path: /workspace/rust-project/**}
      - {path: /home/agent/.local/**}
      - {path: /usr/local/bin/mbx}
      - {path: /usr/local/bin/mise}
      - {path: /usr/local/bin/cargo-nextest}

  socket_database:
    endpoints:
      - {host: host.docker.internal, port: 18090, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
    binaries:
      - {path: /usr/bin/python3*}
