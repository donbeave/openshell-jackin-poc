version: 1
process:
  run_as_user: "0"
  run_as_group: "0"
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /sbin, /usr, /usr/local, /lib, /lib64, /etc, /proc, /sys, /dev/urandom, /opt]
  read_write: [/workspace, /sandbox, /tmp, /home, /dev/null]
landlock:
  compatibility: best_effort
network_policies: {}
