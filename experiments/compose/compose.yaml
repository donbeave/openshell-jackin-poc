services:
  database:
    image: redis:7.4-alpine
    ports: ["18082:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 15
  app:
    build: .
    depends_on:
      database:
        condition: service_healthy
    command: ["sh", "-ec", "echo PING | nc -w 1 database 6379; exec nginx -g 'daemon off;'"]
    ports: ["18081:80", "80"]
    volumes:
      - /sandbox/ojp-project/compose/html:/usr/share/nginx/html:ro
