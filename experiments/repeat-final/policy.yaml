version: 1
filesystem_policy:
  include_workdir: true
  read_only: [/bin, /sbin, /usr, /usr/local, /lib, /lib64, /etc, /proc, /sys, /dev/urandom, /opt]
  read_write: [/workspace, /sandbox, /tmp, /home, /dev/null]
landlock:
  compatibility: best_effort
network_policies:
  engine:
    endpoints:
      - host: host.docker.internal
        port: 18777
        protocol: tcp
        tls: skip
        allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]
    binaries:
      - {path: /usr/local/bin/docker}
      - {path: /usr/local/libexec/docker/cli-plugins/docker-compose}
      - {path: /sandbox/ojp-project/clean-repeat/**}
      - {path: /usr/local/bin/mise}
      - {path: /usr/local/bin/mbx}
      - {path: /usr/local/bin/cargo-nextest}
      - {path: /usr/local/rustup/**}
      - {path: /home/agent/.local/**}
  services:
    endpoints:
      - {host: host.docker.internal, port: 15433, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18086, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18087, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18085, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18088, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
      - {host: host.docker.internal, port: 18089, protocol: tcp, allowed_ips: [192.168.0.0/16, 172.16.0.0/12, 10.0.0.0/8]}
    binaries:
      - {path: /usr/bin/python3*}
      - {path: /usr/bin/curl}
      - {path: /sandbox/ojp-project/clean-repeat/**}
      - {path: /usr/local/bin/mise}
      - {path: /usr/local/bin/mbx}
      - {path: /usr/local/bin/cargo-nextest}
      - {path: /usr/local/rustup/**}
      - {path: /home/agent/.local/**}
  crates:
    endpoints:
      - {host: index.crates.io, port: 443}
      - {host: static.crates.io, port: 443}
      - {host: crates.io, port: 443}
    binaries:
      - {path: /usr/local/bin/mise}
      - {path: /usr/local/bin/mbx}
      - {path: /usr/local/rustup/**}
      - {path: /home/agent/.local/**}
